name: Refresh data

on:
  schedule:
    - cron: "30 21 * * 1-5"  # weekdays after the US close (including standard time)
  workflow_dispatch:

permissions:
  contents: read

concurrency: refresh-data

jobs:
  refresh:
    if: github.repository == 'elisemory/momentum-portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bundle_artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Restore last published data
        run: python -m momentum.live --download
      - name: Refresh prices and index membership
        run: python -m momentum.live --refresh
      - name: Pack data bundle
        run: python -m momentum.live --pack /tmp/momentum-data.tar.gz
      - name: Upload data bundle for publishing
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: /tmp/momentum-data.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    if: github.repository == 'elisemory/momentum-portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only download the immutable artifact from this run. Do not check out code,
      # install dependencies, or extract/execute the downloaded market data here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.refresh.outputs.bundle_artifact_id }}
          path: bundle
          skip-decompress: true
          digest-mismatch: error
      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data-latest bundle/momentum-data.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
